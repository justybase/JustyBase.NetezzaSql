name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JustyBase.NetezzaSql.sln

      - name: Build
        run: dotnet build JustyBase.NetezzaSql.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test JustyBase.NetezzaSql.sln --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage" --filter "Category!=Performance"

      - name: Parser performance budgets
        run: dotnet test tests/JustyBase.NetezzaSql.Tests/JustyBase.NetezzaSql.Tests.csproj --no-build --configuration Release --filter "Category=Performance"

      - name: Verify per-library coverage
        shell: pwsh
        run: ./eng/Test-Coverage.ps1 -Configuration Release

      - name: Check package vulnerabilities
        run: dotnet list JustyBase.NetezzaSql.sln package --vulnerable --include-transitive

      - name: Pack libraries
        shell: bash
        run: |
          dotnet pack JustyBase.NetezzaSqlParser.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.NetezzaDdl/JustyBase.NetezzaDdl.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.NetezzaCatalogSql/JustyBase.NetezzaCatalogSql.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.Netezza/JustyBase.Netezza.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.Sqlite/JustyBase.Sqlite.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.Core/JustyBase.Core.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.ImportExport/JustyBase.ImportExport.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.Ai/JustyBase.Ai.csproj --no-build --configuration Release --output artifacts/packages
          dotnet pack JustyBase.Ai.Embedded/JustyBase.Ai.Embedded.csproj --no-build --configuration Release --output artifacts/packages

      - name: Build a package-only consumer
        shell: pwsh
        run: ./eng/Test-PackageConsumer.ps1 -Configuration Release

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: netezza-sql-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/coverage/*.cobertura.xml

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

  aot-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish AI AOT probe
        run: dotnet publish tests/JustyBase.Ai.AotProbe/JustyBase.Ai.AotProbe.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot/ai-probe -p:CopilotSkipCliDownload=true

      - name: Run AI AOT probe
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './artifacts/aot/ai-probe/JustyBase.Ai.AotProbe.exe' } else { './artifacts/aot/ai-probe/JustyBase.Ai.AotProbe' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "AI AOT probe failed with code $LASTEXITCODE." }
