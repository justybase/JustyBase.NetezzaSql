name: Build & Publish

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore JustyBase.NetezzaSql.sln

      - name: Build
        run: dotnet build JustyBase.NetezzaSql.sln --no-restore -c Release

      - name: Test
        run: dotnet test JustyBase.NetezzaSql.sln --no-build -c Release --verbosity normal

      - name: Pack
        shell: pwsh
        run: |
          $ver = '${{ github.event.release.tag_name }}'
          if ([string]::IsNullOrWhiteSpace($ver)) {
            dotnet pack JustyBase.NetezzaSql.sln --no-build -c Release -o ./artifacts
          } else {
            if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
            Write-Host "Packing with PackageVersion=$ver"
            dotnet pack JustyBase.NetezzaSql.sln --no-build -c Release -o ./artifacts -p:PackageVersion=$ver
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: pwsh
        run: |
          $key = '${{ steps.login.outputs.NUGET_API_KEY }}'
          foreach ($file in Get-ChildItem ./artifacts/*.nupkg, ./artifacts/*.snupkg -ErrorAction SilentlyContinue) {
            Write-Host "Pushing $($file.Name)"
            dotnet nuget push $file.FullName --api-key $key --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
